# docker-compose.yml
version: '3.9'
services:
  db:
    image: postgres:16
    ports: ['5432:5432']
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: scamfirewall }
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes: { pgdata: {} } 